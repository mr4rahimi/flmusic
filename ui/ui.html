<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>فندق — صفحه فید</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background:
      radial-gradient(1200px 800px at 30% -10%, #eceefb, transparent 60%),
      radial-gradient(1000px 700px at 100% 110%, #f3eef9, transparent 55%),
      #e9eaf0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; padding: 28px;
  }
  .stage { transform-origin: center; }

  /* ───────── design tokens ───────── */
  .fx-root {
    --accent: var(--accent-base, #4f46e5);
    --accent-ink: #ffffff;
    --accent-weak: color-mix(in oklab, var(--accent), transparent 88%);
    --accent-line: color-mix(in oklab, var(--accent), transparent 70%);

    --bg: oklch(0.973 0.004 270);
    --surface: #ffffff;
    --surface-2: oklch(0.964 0.005 270);
    --elev: #ffffff;
    --text: oklch(0.255 0.02 270);
    --text-2: oklch(0.515 0.018 270);
    --text-3: oklch(0.64 0.015 270);
    --border: oklch(0.92 0.006 270);
    --border-2: oklch(0.885 0.008 270);
    --shadow-sm: 0 1px 2px rgba(28,28,54,.05), 0 2px 8px rgba(28,28,54,.045);
    --shadow-md: 0 6px 18px rgba(28,28,54,.08), 0 2px 6px rgba(28,28,54,.05);
    --shadow-lg: 0 18px 44px rgba(28,28,54,.16);
    --bar-blur: saturate(180%) blur(20px);

    font-family: 'Vazirmatn', system-ui, sans-serif;
    height: 100%; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    position: relative; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .fx-root[data-theme="dark"] {
    --accent: color-mix(in oklab, var(--accent-base, #4f46e5), white 16%);
    --accent-weak: color-mix(in oklab, var(--accent), transparent 84%);
    --accent-line: color-mix(in oklab, var(--accent), transparent 64%);
    --bg: oklch(0.165 0.016 270);
    --surface: oklch(0.212 0.017 270);
    --surface-2: oklch(0.252 0.018 270);
    --elev: oklch(0.232 0.018 270);
    --text: oklch(0.965 0.006 270);
    --text-2: oklch(0.72 0.014 270);
    --text-3: oklch(0.575 0.014 270);
    --border: oklch(0.305 0.016 270);
    --border-2: oklch(0.37 0.018 270);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 8px 22px rgba(0,0,0,.4);
    --shadow-lg: 0 18px 44px rgba(0,0,0,.55);
  }
  :where(.fx-root) button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ───────── header ───────── */
  .fx-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 56px 16px 12px;
    background: color-mix(in oklab, var(--bg), transparent 18%);
    backdrop-filter: var(--bar-blur); -webkit-backdrop-filter: var(--bar-blur);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 6; flex-shrink: 0;
  }
  .fx-iconbtn {
    width: 42px; height: 42px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: background .18s, transform .12s;
  }
  .fx-iconbtn:active { transform: scale(.92); background: var(--surface-2); }
  .fx-logo { display: flex; align-items: center; gap: 9px; }
  .fx-logo-mark {
    width: 30px; height: 30px; border-radius: 10px;
    background: linear-gradient(145deg, var(--accent), color-mix(in oklab, var(--accent), #000 26%));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px var(--accent-weak), inset 0 1px 1px rgba(255,255,255,.35);
    transform: rotate(-6deg);
  }
  .fx-seed { width: 11px; height: 13px; background: #fff; border-radius: 60% 60% 55% 55% / 70% 70% 40% 40%;
             transform: rotate(8deg); box-shadow: inset -1px -1px 1px rgba(0,0,0,.12); }
  .fx-logo-word { font-size: 23px; font-weight: 800; letter-spacing: -.5px; }

  .fx-theme-swap { position: relative; width: 22px; height: 22px; }
  .fx-theme-swap svg { position: absolute; inset: 0; transition: opacity .3s, transform .4s; }
  .fx-theme-swap svg:nth-child(1) { opacity: 1; transform: rotate(0) scale(1); }
  .fx-theme-swap svg:nth-child(2) { opacity: 0; transform: rotate(-60deg) scale(.4); }
  .fx-theme-swap[data-dark="1"] svg:nth-child(1) { opacity: 0; transform: rotate(60deg) scale(.4); }
  .fx-theme-swap[data-dark="1"] svg:nth-child(2) { opacity: 1; transform: rotate(0) scale(1); }

  /* ───────── tabs ───────── */
  .fx-tabs {
    display: flex; gap: 4px; padding: 9px 14px 12px; position: relative;
    background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 5;
  }
  .fx-tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 4px; border-radius: 12px; font-size: 14px; font-weight: 600;
    color: var(--text-3); position: relative; z-index: 1; transition: color .25s;
  }
  .fx-tab svg { opacity: .8; }
  .fx-tab.is-active { color: var(--accent-ink); }
  .fx-tabs-pill {
    position: absolute; top: 9px; height: calc(100% - 21px); left: 0;
    background: var(--accent); border-radius: 12px; z-index: 0;
    box-shadow: 0 4px 12px var(--accent-weak);
    transition: transform .38s cubic-bezier(.4,1.2,.4,1), width .38s cubic-bezier(.4,1.2,.4,1);
  }

  /* ───────── feed ───────── */
  .fx-feed { flex: 1 1 0%; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; z-index: 0; }
  .fx-feed::-webkit-scrollbar { width: 0; }
  .fx-feed-inner { padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 16px;
                   animation: feedIn .4s ease both; }
  @keyframes feedIn { from { opacity: 0; } to { opacity: 1; } }

  .fx-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    overflow: hidden; box-shadow: var(--shadow-sm);
    animation: cardIn .5s cubic-bezier(.2,.7,.3,1) both; animation-delay: var(--d);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }

  .fx-cover { position: relative; aspect-ratio: 1 / 1; width: 100%; overflow: hidden; user-select: none; }
  .fx-cover-scrim { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.16), transparent 26% 64%, rgba(0,0,0,.34)); }

  .fx-chip {
    position: absolute; z-index: 3; font-size: 11.5px; font-weight: 600; color: #fff;
    padding: 5px 10px; border-radius: 999px; letter-spacing: -.2px;
    background: rgba(12,14,28,.34); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.18);
  }
  .fx-chip-genre { top: 12px; right: 12px; }
  .fx-chip-dur { bottom: 12px; left: 12px; font-variant-numeric: tabular-nums; }

  .fx-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 66px; height: 66px; border-radius: 50%; z-index: 3;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: rgba(15,17,30,.40);
    border: 1.5px solid rgba(255,255,255,.6);
    box-shadow: 0 8px 24px rgba(0,0,0,.32), inset 0 1px 1px rgba(255,255,255,.25);
    transition: transform .18s cubic-bezier(.3,1.4,.5,1), background .25s;
  }
  .fx-play:hover { transform: translate(-50%,-50%) scale(1.07); }
  .fx-play:active { transform: translate(-50%,-50%) scale(.94); }
  .fx-play.is-playing { background: color-mix(in oklab, var(--accent), black 4%); border-color: rgba(255,255,255,.7); }

  .fx-cover-prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.22); z-index: 4; }
  .fx-cover-prog span { display: block; height: 100%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); transition: width .25s linear; }

  .fx-burst { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.2); z-index: 5;
              color: #fff; opacity: 0; pointer-events: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); }
  .fx-burst.is-on { animation: burst .62s cubic-bezier(.2,.8,.3,1); }
  @keyframes burst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2); }
    35% { opacity: .95; transform: translate(-50%,-50%) scale(1.05); }
    70% { opacity: .95; transform: translate(-50%,-50%) scale(.95); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25); } }

  /* card body */
  .fx-card-body { padding: 13px 15px 14px; }
  .fx-meta { display: flex; align-items: center; gap: 10px; }
  .fx-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); }
  .fx-meta-txt { flex: 1; min-width: 0; }
  .fx-author { display: flex; align-items: center; gap: 5px; }
  .fx-author-name { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-verified { width: 15px; height: 15px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fx-date { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .fx-followbtn { font-size: 12.5px; font-weight: 700; color: var(--accent);
    padding: 6px 13px; border-radius: 999px; border: 1.4px solid var(--accent-line); transition: background .18s; }
  .fx-followbtn:active { background: var(--accent-weak); }
  .fx-ghostbtn { width: 34px; height: 34px; border-radius: 11px; color: var(--text-2);
    display: flex; align-items: center; justify-content: center; transition: background .18s, color .18s; }
  .fx-ghostbtn:active { background: var(--surface-2); }
  .fx-ghostbtn.is-on { color: var(--accent); }

  .fx-title { margin: 12px 0 12px; font-size: 18.5px; font-weight: 700; letter-spacing: -.3px; line-height: 1.3; }

  .fx-actions { display: flex; align-items: center; gap: 18px; }
  .fx-act { display: flex; align-items: center; gap: 6px; color: var(--text-2);
    font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; transition: color .18s, transform .12s; }
  .fx-act:active { transform: scale(.9); }
  .fx-like.is-liked { color: var(--accent); }
  .fx-like.is-pop svg { animation: pop .55s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { 0%{transform:scale(1)} 35%{transform:scale(1.4)} 60%{transform:scale(.85)} 100%{transform:scale(1)} }
  .fx-spacer { flex: 1; }

  /* end of feed */
  .fx-end { text-align: center; color: var(--text-3); font-size: 12.5px; padding: 14px 0 4px; }

  /* ───────── mini player ───────── */
  .fx-player {
    flex-shrink: 0; position: relative; margin: 0 10px;
    background: var(--elev); border: 1px solid var(--border-2); border-radius: 18px;
    box-shadow: var(--shadow-md); overflow: hidden; z-index: 11;
    animation: playerUp .42s cubic-bezier(.2,.9,.3,1.05) both;
  }
  @keyframes playerUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .fx-player-prog { height: 3px; background: var(--surface-2); }
  .fx-player-prog span { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
  .fx-player-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; }
  .fx-player-cover { width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .fx-player-txt { flex: 1; min-width: 0; }
  .fx-player-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-player-artist { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .fx-player-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--accent-weak); transition: transform .12s; }
  .fx-player-btn:active { transform: scale(.9); }
  .fx-player-close { width: 32px; height: 32px; border-radius: 10px; color: var(--text-3);
    display: flex; align-items: center; justify-content: center; }

  /* ───────── bottom nav ───────── */
  .fx-nav {
    flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-around;
    padding: 11px 8px 30px; position: relative; z-index: 12;
    background: color-mix(in oklab, var(--surface), transparent 5%);
    backdrop-filter: var(--bar-blur); -webkit-backdrop-filter: var(--bar-blur);
    border-top: 1px solid var(--border);
  }
  .fx-navitem { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 58px;
    color: var(--text-3); transition: color .2s; }
  .fx-navitem.is-active { color: var(--accent); }
  .fx-navicon { position: relative; transition: transform .2s; }
  .fx-navitem.is-active .fx-navicon { transform: translateY(-1px); }
  .fx-navitem:active .fx-navicon { transform: scale(.85); }
  .fx-navlabel { font-size: 10.5px; font-weight: 600; }
  .fx-navbadge { position: absolute; top: -5px; left: -7px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: #ef4444; color: #fff; font-size: 9.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--surface); }
  .fx-fab { width: 56px; height: 56px; border-radius: 19px; margin-top: -16px; color: #fff;
    background: linear-gradient(150deg, var(--accent), color-mix(in oklab, var(--accent), #000 22%));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px var(--accent-line), inset 0 1px 1px rgba(255,255,255,.35);
    transition: transform .16s; }
  .fx-fab:active { transform: scale(.9) rotate(90deg); }

  /* ───────── scrim shared ───────── */
  .fx-scrim { position: absolute; inset: 0; background: rgba(10,12,24,.46);
    opacity: 0; transition: opacity .32s; pointer-events: none; }
  .is-open > .fx-scrim { opacity: 1; pointer-events: auto; }

  /* ───────── drawer ───────── */
  .fx-drawer-wrap { position: absolute; inset: 0; z-index: 30; pointer-events: none;
    visibility: hidden; transition: visibility 0s linear .42s; }
  .fx-drawer-wrap.is-open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
  .fx-drawer { position: absolute; top: 0; bottom: 0; right: 0; width: 300px; max-width: 86%;
    background: var(--bg); box-shadow: var(--shadow-lg); padding: 56px 18px 24px;
    transform: translateX(100%); transition: transform .36s cubic-bezier(.3,.9,.3,1);
    display: flex; flex-direction: column; }
  .fx-drawer-wrap.is-open .fx-drawer { transform: none; }
  .fx-drawer-head { display: flex; align-items: center; gap: 12px; }
  .fx-drawer-avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(140deg, var(--accent), color-mix(in oklab, var(--accent), #ec4899 60%));
    color: #fff; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .fx-drawer-name { font-weight: 700; font-size: 16px; }
  .fx-drawer-handle { font-size: 12.5px; color: var(--text-3); }
  .fx-drawer-head .fx-ghostbtn { margin-right: auto; }
  .fx-drawer-stats { display: flex; gap: 8px; margin: 18px 0 6px; }
  .fx-drawer-stats > div { flex: 1; background: var(--surface-2); border-radius: 14px; padding: 11px 6px; text-align: center; }
  .fx-drawer-stats b { display: block; font-size: 15px; font-weight: 800; }
  .fx-drawer-stats span { font-size: 11px; color: var(--text-3); }
  .fx-drawer-list { margin-top: 12px; display: flex; flex-direction: column; }
  .fx-drawer-item { display: flex; align-items: center; gap: 13px; padding: 13px 8px; font-size: 14.5px; font-weight: 600;
    color: var(--text); border-radius: 12px; transition: background .15s; }
  .fx-drawer-item:active { background: var(--surface-2); }
  .fx-drawer-item svg:first-child { color: var(--text-2); }
  .fx-drawer-chev { margin-right: auto; color: var(--text-3); }
  .fx-drawer-theme { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 13px; border-radius: 14px; background: var(--surface-2); font-weight: 700; font-size: 14px; color: var(--text); }

  /* ───────── upload sheet ───────── */
  .fx-sheet-wrap { position: absolute; inset: 0; z-index: 32; pointer-events: none;
    visibility: hidden; transition: visibility 0s linear .42s; }
  .fx-sheet-wrap.is-open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
  .fx-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: 26px 26px 0 0; box-shadow: var(--shadow-lg); padding: 10px 18px 30px;
    transform: translateY(105%); transition: transform .4s cubic-bezier(.3,.9,.3,1); }
  .fx-sheet-wrap.is-open .fx-sheet { transform: none; }
  .fx-sheet-grip { width: 40px; height: 5px; border-radius: 999px; background: var(--border-2); margin: 0 auto 16px; }
  .fx-sheet-title { margin: 0; font-size: 19px; font-weight: 800; text-align: center; }
  .fx-sheet-sub { margin: 5px 0 18px; font-size: 13px; color: var(--text-3); text-align: center; }
  .fx-sheet-opts { display: flex; flex-direction: column; gap: 10px; }
  .fx-sheet-opt { display: flex; align-items: center; gap: 13px; padding: 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--border); text-align: right; transition: transform .12s, border-color .15s; }
  .fx-sheet-opt:active { transform: scale(.98); border-color: var(--accent-line); }
  .fx-sheet-ico { width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0; color: var(--accent);
    background: var(--accent-weak); display: flex; align-items: center; justify-content: center; }
  .fx-sheet-txt { flex: 1; display: flex; flex-direction: column; }
  .fx-sheet-opt-label { font-weight: 700; font-size: 14.5px; }
  .fx-sheet-opt-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .fx-sheet-cancel { width: 100%; margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--surface-2);
    font-weight: 700; font-size: 14.5px; color: var(--text-2); }

  /* equalizer */
  @keyframes eqbar { 0%,100% { height: 35%; } 50% { height: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .fx-card, .fx-feed-inner, .fx-player { animation: none !important; }
    .fx-burst.is-on, .fx-like.is-pop svg { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="./ios-frame.jsx"></script>
  <script type="text/babel" src="./tweaks-panel.jsx"></script>
  <script type="text/babel" src="./app/feed-data.jsx"></script>
  <script type="text/babel" src="./app/feed-data.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "dark": true,
      "accent": "#f97316",
      "coverRatio": "square"
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // fit device to viewport
      const [scale, setScale] = useState(1);
      useEffect(() => {
        const W = 402, H = 874;
        const fit = () => {
          const s = Math.min((window.innerWidth - 48) / W, (window.innerHeight - 48) / H, 1);
          setScale(s > 0 ? s : 1);
        };
        fit(); window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      return (
        <React.Fragment>
          <div style={{ transform: `scale(${scale})`, transformOrigin: 'center' }}>
            <IOSDevice dark={t.dark}>
              <div style={{ '--accent-base': t.accent, height: '100%' }}>
                <FeedApp t={t} setTweak={setTweak} />
              </div>
            </IOSDevice>
          </div>

          <TweaksPanel>
            <TweakSection label="ظاهر" />
            <TweakToggle label="حالت شب" value={t.dark} onChange={(v) => setTweak('dark', v)} />
            <TweakColor label="رنگ اکسنت" value={t.accent}
              options={['#4f46e5', '#7c3aed', '#0ea5a4', '#e11d6b', '#f97316']}
              onChange={(v) => setTweak('accent', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    // pass --accent-base down: the wrapper div sets it for .fx-root descendants
    ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);
  </script>
</body>
</html>
