name: music_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.4
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.12
  audio_service: ^0.18.14
  audio_session: ^0.1.22
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0
  timeago: ^3.7.0
  infinite_scroll_pagination: ^4.1.0
  permission_handler: ^12.0.2
  file_picker: ^8.1.2
  image_picker: ^1.2.1
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/logo.png"