# ---------------------------------------------------------------------------
# flmusic.ir — وب (Next.js) + API (NestJS) پشت CDN پارس‌پک
#
# نصب روی سرور:
#   /etc/nginx/sites-available/flmusic.ir
#   ln -s /etc/nginx/sites-available/flmusic.ir /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# مهم: این فایل فقط server_name flmusic.ir را می‌گیرد و به سایت‌های
# دیگر روی این سرور دست نمی‌زند. هرگز default_server را اینجا ننویسید.
# ---------------------------------------------------------------------------

# پورت ۳۰۰۶ انتخاب شده چون روی این سرور پورت‌های ۳۰۰۰ تا ۳۰۰۵،
# ۳۰۱۰، ۳۰۲۰ و ۳۰۳۰ در اختیار سایت‌های دیگرند.
upstream flmusic_web {
    server 127.0.0.1:3006;
    keepalive 32;
}

upstream flmusic_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name flmusic.ir www.flmusic.ir;

    # CDN پارس‌پک TLS را در لبه تمام می‌کند و با HTTP به origin وصل می‌شود،
    # پس اینجا ریدایرکت اجباری به HTTPS نمی‌گذاریم — وگرنه حلقه‌ی ریدایرکت
    # می‌سازد. اجبار HTTPS باید در پنل CDN فعال شود.

    access_log /var/log/nginx/flmusic.access.log;
    error_log  /var/log/nginx/flmusic.error.log;

    client_max_body_size 200m;

    # IP واقعی بازدیدکننده از هدر CDN خوانده شود (برای لاگ و نرخ‌محدودی)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml;

    # --- یک دامنه: www به بدون‌www ---------------------------------------
    if ($host = www.flmusic.ir) {
        return 301 http://flmusic.ir$request_uri;
    }

    # --- API ---------------------------------------------------------------
    # توجه: کانفیگ جداگانه‌ای برای api.flmusic.ir از قبل روی سرور هست
    # (/etc/nginx/sites-available/music-api). این location با آن تداخل ندارد
    # چون server_name متفاوت است، و صرفاً API را زیر همان دامنه‌ی اصلی هم
    # در دسترس می‌گذارد تا از کش CDN بهره ببرد.
    location /api/ {
        proxy_pass http://flmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # --- فایل‌های آپلودشده (کاور، آواتار، صوت) -----------------------------
    location /uploads/ {
        proxy_pass http://flmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # کاور و فایل صوتی پس از آپلود تغییر نمی‌کنند؛ کش طولانی در CDN
        # هم پهنای‌باند سرور را کم می‌کند هم LCP را بهتر می‌کند.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # پخش با seek (درخواست بازه‌ای) برای فایل صوتی لازم است
        proxy_force_ranges on;
    }

    # --- دارایی‌های ساخته‌شده‌ی Next --------------------------------------
    # نام فایل‌ها هش دارد، پس کش دائمی امن است.
    location /_next/static/ {
        proxy_pass http://flmusic_web;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- خود اپلیکیشن وب ---------------------------------------------------
    location / {
        proxy_pass http://flmusic_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
