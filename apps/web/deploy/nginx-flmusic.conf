# ---------------------------------------------------------------------------
# flmusic.ir — وب (Next.js :3006) + API (NestJS :3000)
#
# نصب:
#   ./deploy/deploy.sh nginx
# که پشتیبان می‌گیرد، `nginx -t` می‌زند و فقط در صورت موفقیت reload می‌کند.
#
# ایمنی روی این سرور مشترک:
#   • هیچ بلوکی default_server ندارد — پس ترافیک دامنه‌های دیگر را نمی‌دزدد
#   • server_name دقیقاً flmusic.ir و www.flmusic.ir است
#   • api.flmusic.ir جداگانه در sites-available/music-api مدیریت می‌شود
#     و اینجا دست نمی‌خورد
# ---------------------------------------------------------------------------

# پورت ۳۰۰۶ انتخاب شده چون روی این سرور پورت‌های ۳۰۰۰ تا ۳۰۰۵،
# ۳۰۱۰، ۳۰۲۰ و ۳۰۳۰ در اختیار سایت‌های دیگرند.
upstream flmusic_web {
    server 127.0.0.1:3006;
    keepalive 32;
}

upstream flmusic_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP — فقط چالش ACME و ریدایرکت به HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flmusic.ir www.flmusic.ir;

    # تمدید گواهی Let's Encrypt با روش webroot — همان مسیری که
    # سایت‌های دیگر این سرور استفاده می‌کنند.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # اگر روزی دوباره پشت CDN رفت و CDN با HTTP به origin وصل شد،
    # این شرط جلوی حلقه‌ی بی‌نهایت ریدایرکت را می‌گیرد.
    location / {
        if ($http_x_forwarded_proto = "https") {
            proxy_pass http://flmusic_web;
        }
        return 301 https://flmusic.ir$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    # سینتکس `http2 on;` از nginx 1.25 به بعد است؛ این سرور 1.24 دارد.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flmusic.ir www.flmusic.ir;

    ssl_certificate     /etc/letsencrypt/live/flmusic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flmusic.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:flmusic_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/flmusic.access.log;
    error_log  /var/log/nginx/flmusic.error.log;

    client_max_body_size 200m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml;

    # یک دامنه‌ی canonical: www به بدون‌www
    if ($host = www.flmusic.ir) {
        return 301 https://flmusic.ir$request_uri;
    }

    # --- API ---------------------------------------------------------------
    # api.flmusic.ir از قبل جداگانه سرو می‌شود؛ این location صرفاً API را
    # زیر همان دامنه‌ی اصلی هم در دسترس می‌گذارد.
    location /api/ {
        proxy_pass http://flmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    # --- فایل‌های آپلودشده (کاور، آواتار، صوت) -----------------------------
    location /uploads/ {
        proxy_pass http://flmusic_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # این فایل‌ها پس از آپلود تغییر نمی‌کنند
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # پخش با seek (درخواست بازه‌ای) برای فایل صوتی لازم است
        proxy_force_ranges on;
    }

    # --- دارایی‌های ساخته‌شده‌ی Next (نام فایل‌ها هش دارد) ------------------
    location /_next/static/ {
        proxy_pass http://flmusic_web;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- اپلیکیشن وب -------------------------------------------------------
    location / {
        proxy_pass http://flmusic_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
